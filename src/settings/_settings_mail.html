<div class="row mb-3">
	<label for="input-mail-engine" class="col-sm-2 col-form-label">Mail Engine</label>
	<div class="col-sm-10">
		<select class="form-select" name="settings[driver]" data-v-setting="driver" id="input-mail-driver">
			<option value="mail">Mail</option>
			<option value="smtp">SMTP</option>
		</select>
	</div>
</div>

<div class="mail-engine mail">
	<div class="row mb-3">
		<label for="input-mail-parameter" class="col-sm-2 col-form-label">Mail Parameters</label>
		<div class="col-sm-10">
			<input type="text" name="settings[parameter]" data-v-setting="parameter" value="" placeholder="Additional Parameters" id="input-mail-parameter" class="form-control">
			<div class="form-text">e.g. -f email@mysite.com</div>
		</div>
	</div>

	<div class="row mb-3">
		<label for="input-mail-sender_override" class="col-sm-2 col-form-label">
		<span>Sender</span>
		<div class="form-text">Leave empty to use site title</div>
		</label>
		<div class="col-sm-10">
			<input type="text" name="settings[mail][sender_override]" data-v-setting="mail.sender_override" value="" placeholder="Sender" id="input-mail-sender_override" class="form-control">
		</div>
	</div>

	<div class="row mb-3">
		<label for="input-mail-from_address" class="col-sm-2 col-form-label">
		<span>From</span>
		<div class="form-text">Leave empty to use site contact email address</div>
		</label>
		<div class="col-sm-10">
			<input type="text" name="settings[mail][from_address]" data-v-setting="mail.from_address" value="" placeholder="From" id="input-mail-from_address" class="form-control">
		</div>
	</div>
	<div class="row mb-3">
		<label for="input-mail-reply_to" class="col-sm-2 col-form-label">
		<span>Reply to</span>
		<div class="form-text">Leave empty to use site contact email address</div>
		</label>
		<div class="col-sm-10">
			<input type="text" name="settings[mail][reply_to]" data-v-setting="mail.reply_to" value="" placeholder="Reply to" id="input-mail-reply_to" class="form-control">
		</div>
	</div>
</div>

<div class="mail-engine smtp">
	<label class="form-label fw-bold border-bottom d-block mb-4 py-3">SMTP</label>
	<div class="row mb-3">
		<label for="input-mail-smtp-host" class="col-sm-2 col-form-label">Hostname</label>
		<div class="col-sm-10">
			<input type="text" name="settings[smtp][host]" data-v-setting="smtp.host" value="" placeholder="mail.example.com" id="input-mail-smtp-host" class="form-control">
			<div class="form-text">Plain hostname, e.g. mail.example.com. No prefix needed, encryption is set below.</div>
		</div>
	</div>
	<div class="row mb-3">
		<label for="input-mail-smtp-encryption" class="col-sm-2 col-form-label">Encryption</label>
		<div class="col-sm-10">
			<select class="form-select" name="settings[smtp][encryption]" data-v-setting="smtp.encryption" id="input-mail-smtp-encryption">
				<option value="">None</option>
				<option value="tls">TLS (STARTTLS)</option>
				<option value="ssl">SSL (SMTPS)</option>
			</select>
			<div class="form-text">STARTTLS upgrades the connection, usually port 587. SSL connects encrypted from the start, usually port 465.</div>
		</div>
	</div>
	<div class="row mb-3">
		<label for="input-mail-smtp-user" class="col-sm-2 col-form-label">Username</label>
		<div class="col-sm-10">
			<input type="text" name="settings[smtp][user]" data-v-setting="smtp.user" value="" placeholder="Username" id="input-mail-smtp-user" class="form-control">
		</div>
	</div>
	<div class="row mb-3">
		<label for="input-mail-smtp-password" class="col-sm-2 col-form-label">Password</label>
		<div class="col-sm-10">
			
			<div class="input-group">
				  <input type="password" autocorrect="off" class="form-control" placeholder="Password"  id="input-mail-smtp-password" autocomplete="off" value="" aria-label="Password" name="settings[smtp][password]" data-v-setting="smtp.password">
				  <div class="input-group-append">
					<button class="btn px-3 border border-start-0" type="button" onclick="togglePasswordInput(this, 'input-mail-smtp-password')"><svg class="svg-icon" aria-hidden="true"><use href="/admin/default/img/icons.svg#eye-off"></use></svg></button>
				  </div>
			  </div>
			
		</div>
	</div>
	<div class="row mb-3">
		<label for="input-mail-smtp-port" class="col-sm-2 col-form-label">Port</label>
		<div class="col-sm-10">
			<input type="text" name="settings[smtp][port]" data-v-setting="smtp.port" value="25" placeholder="Port" id="input-mail-smtp-port" class="form-control">
			<div class="form-text">Common ports: 25 (plain), 587 (STARTTLS), 465 (SSL).</div>
		</div>
	</div>
	<div class="row mb-3">
		<label for="input-mail-smtp-timeout" class="col-sm-2 col-form-label">Timeout</label>
		<div class="col-sm-10">
			<input type="text" name="settings[smtp][timeout]" data-v-setting="smtp.timeout" value="5" placeholder="Timeout" id="input-mail-smtp-timeout" class="form-control">
		</div>
	</div>

	<div class="row mb-3">
		<label for="input-mail-smtp-sender_override" class="col-sm-2 col-form-label">
		<span>Sender</span>
		<div class="form-text">Leave empty to use site title</div>
		</label>
		<div class="col-sm-10">
			<input type="text" name="settings[smtp][sender_override]" data-v-setting="smtp.sender_override" value="" placeholder="Sender" id="input-mail-smtp-sender" class="form-control">
		</div>
	</div>	

	<div class="row mb-3">
		<label for="input-mail-smtp-from_address" class="col-sm-2 col-form-label">
		<span>From</span>
		<div class="form-text">Leave empty to use site contact email address</div>
		</label>
		<div class="col-sm-10">
			<input type="text" name="settings[smtp][from_address]" data-v-setting="smtp.from_address" value="" placeholder="From" id="input-mail-smtp-from_address" class="form-control">
		</div>
	</div>	
	<div class="row mb-3">
		<label for="input-mail-smtp-reply_to" class="col-sm-2 col-form-label">
		<span>Reply to</span>
		<div class="form-text">Leave empty to use site contact email address</div>
		</label>
		<div class="col-sm-10">
			<input type="text" name="settings[smtp][reply_to]" data-v-setting="smtp.reply_to" value="" placeholder="Reply to" id="input-mail-smtp-reply_to" class="form-control">
		</div>
	</div>
</div>


<div class="test-mail">
	<label class="form-label fw-bold border-bottom d-block mb-4 py-3">Send test email</label>
	<div class="row mb-3">
		<label for="input-mail-parameter" class="col-sm-2 col-form-label">Send to email address</label>
		<div class="col-sm-10">
		<div class="input-group mb-3">
			<input type="text" name="to" data-v-setting="parameter" value="" placeholder="myemailaddress@domain.com" id="input-mail-parameter" class="form-control">
			<button type="submit" name="action" value="test" class="btn btn-outline-success btn-icon">
				<span>Send email</span>
				<svg class="svg-icon ms-2" aria-hidden="true"><use href="/admin/default/img/icons.svg#brand-telegram"></use></svg>
			  </button>
		</div>
	</div>
</div>
