<div id="input-text">

	  <label for="input-text" class="col-form-label">Text</label>
	  <div>
		<input readonly type="text" class="form-control" id="input-text" placeholder="Name" name="text" required>
	  </div>
	
</div>

<div id="input-number">

	  <label for="input-number" class="col-form-label">Number</label>
	  <div>
		<input readonly type="number" class="form-control" id="input-number" placeholder="Name" name="number" required>
	  </div>
	
</div>

<div id="input-boolean">

	  <label for="input-boolean" class="col-form-label">Boolean</label>
	  <div>
		<input readonly type="number" class="form-control" id="input-boolean" placeholder="Name" name="boolean" required>
	  </div>
	
</div>

<div id="input-textarea">

	  <label for="input-textarea" class="col-form-label">Textarea</label>
	  <div>
		<textarea readonly class="form-control" id="input-textarea" placeholder="Name" name="textarea" required></textarea>
	  </div>
	
</div>

<div id="input-select">

	  <label for="input-select" class="col-form-label">Select</label>
	  <div>
		<select readonly class="form-control" id="input-select" name="select" required>
			<option></option>
			<option></option>
			<option></option>
		</select>
	  </div>
	
</div>
