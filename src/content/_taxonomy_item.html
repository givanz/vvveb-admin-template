<li class="dd-item dd3-item" data-v-id data-v-taxonomy_item>
	<div class="dd-handle dd3-handle">Drag</div>
	<div class="dd3-buttons">

		<button onclick="removeTaxonomy(this)" title="Remove taxonomy"
				class="btn btn-outline-danger btn-sm border-0">
			<svg class="svg-icon" aria-hidden="true"><use href="/admin/default/img/icons.svg#trash"></use></svg>
		</button>
		<button onclick="addTaxonomy(this)" title="Add child taxonomy"
				class="btn btn-outline-secondary btn-sm">
			<svg class="svg-icon" aria-hidden="true"><use href="/admin/default/img/icons.svg#plus"></use></svg>
		</button>
		<button type="button" data-bs-toggle="collapse" href="#filters" aria-expanded="false"
				aria-controls="filters" title="Edit"
				class="btn btn-outline-secondary btn-sm expand-btn">
			<svg class="svg-icon" aria-hidden="true"><use href="/admin/default/img/icons.svg#ballpen"></use></svg>
		</button>
	</div>
	<div class="dd3-content">

		<label class="form-check checkbox">
			<input type="checkbox" class="form-check-input" data-v-vvveb-action="table.selectRow" value="" name="taxonomy_item_id[]" data-v-taxonomy_item_id>
			<svg class="svg-icon type-icon opacity-75" aria-hidden="true"><use href="/admin/default/img/icons.svg#link"></use></svg>
			<!--
			<svg class="svg-icon opacity-75"          data-v-if="menu.type = 'product'" aria-hidden="true"><use href="/admin/default/img/icons.svg#box"></use></svg>
			<svg class="svg-icon opacity-75"      data-v-if="menu.type = 'page'" aria-hidden="true"><use href="/admin/default/img/icons.svg#file"></use></svg>
			<svg class="svg-icon opacity-75" data-v-if="menu.type = 'post'" aria-hidden="true"><use href="/admin/default/img/icons.svg#file-text"></use></svg>
			<svg class="svg-icon opacity-75"          data-v-if="menu.type = 'link'" aria-hidden="true"><use href="/admin/default/img/icons.svg#link"></use></svg>
			<svg class="svg-icon opacity-75"          data-v-if="menu.type = 'text'" aria-hidden="true"><use href="/admin/default/img/icons.svg#text-size"></use></svg>
			-->
			<span class="form-check-label" data-v-taxonomy_item-name>New item</span>
			<span class="badge bg-body-tertiary text-muted border ms-3" data-v-taxonomy_item-url></span>
		</label>

	</div>
	
	<div class="expand" style="display:none">
		
		<div class="card">
		  <div class="card-body">
			
				@@include('@@taxonomy_template')

		  </div>
		  
			<div class="card-footer text-end">
			
				<button type="submit" class="btn btn-secondary btn-icon expand-btn">Close</button>
			
				<button type="submit" class="btn btn-primary btn-icon btn-save">

                  <span class="loading d-none">
                    <span class="spinner-border spinner-border-sm align-middle" role="status" aria-hidden="true">
                    </span>
                    <span>Saving ...</span>...
                  </span>

                  <span class="button-text">
					<svg class="svg-icon" aria-hidden="true"><use href="/admin/default/img/icons.svg#pencil"></use></svg>
                    <span>Save changes</span>
                  </span>

                </button>			
			</div>
		</div>
	</div>

</li>
