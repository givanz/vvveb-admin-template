@@include('../../_includes/html-head.html', {"title": "Recover password","scripts":"","base_href":"../../"})

<body class="login">

	<div class="d-flex align-items-center justify-content-center h-100">
			<div class="login-container">
					
									
				<div class="logo-content">
						<a href="//www.vvveb.com" target="_blank"><img src="img/logom.png"/></a>
				</div>

		
				
				<form method="post" role="form" id="login" class="login-form fade-in-effect" enctype="multipart/form-data" action="">
						<input type="hidden" name="csrf" data-v-csrf>
						<input type="hidden" name="action" value="">

						<div class="login-form-content">
						
							@@include('../../_includes/notifications.html')									

							<div class="mb-4">
								<label class="form-label d-flex justify-content-between align-items-center">
									<span>New password</span>
								</label>
								
								<div class="input-group">
								  <input type="password" minlength="6" autocorrect="off" class="form-control" id="password" name="password" autocomplete="off" value="" aria-label="Password" required>
								  <div class="input-group-append">
									<button class="btn px-3" type="button" onclick="togglePasswordInput(this, 'password')"><svg class="svg-icon" aria-hidden="true"><use href="/admin/default/img/icons.svg#eye-off"></use></svg></button>
								  </div>
								</div>
								
							</div>							
							
							
							<div class="mb-4">
								<label class="form-label d-flex justify-content-between align-items-center">
									<span>Confirm password</span>
								</label>
								
								<div class="input-group">
								  <input type="password" minlength="6" autocorrect="off" class="form-control" id="confirm-password" name="confirm_password" autocomplete="off" value="" aria-label="Password" required>
								  <div class="input-group-append">
									<button class="btn px-3" type="button" onclick="togglePasswordInput(this, 'confirm-password')"><svg class="svg-icon" aria-hidden="true"><use href="/admin/default/img/icons.svg#eye-off"></use></svg></button>
								  </div>
								</div>
								
							</div>
						
							
							
							<div class="mb-4 mt-4">

								<button type="submit" class="btn btn-primary btn-icon w-100">
									<span>Change password</span> <svg class="svg-icon float-end ms-2" aria-hidden="true"><use href="/admin/default/img/icons.svg#chevron-right"></use></svg>
								</button>
									
							</div>


						
						</div>
					</div>
					</div>
					
				</form>
						
				</div>
		</div>
  </body>

<script>
function togglePasswordInput(element, input) {
	let password = document.getElementById(input);
	if (password.type == "password") {
		password.type = "text"; 
		let use = element.querySelector("use");
		if (use) use.setAttribute("href", (use.getAttribute("href") || "").split("#")[0] + "#eye");
		else { let i = element.querySelector("i"); if (i) { i.classList.add("icon-eye-outline"); i.classList.remove("icon-eye-off-outline"); } }
	} else {
		password.type = "password";
		let use = element.querySelector("use");
		if (use) use.setAttribute("href", (use.getAttribute("href") || "").split("#")[0] + "#eye-off");
		else { let i = element.querySelector("i"); if (i) { i.classList.remove("icon-eye-outline"); i.classList.add("icon-eye-off-outline"); } }
	}
}
</script>
</html>
