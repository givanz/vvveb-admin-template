<div class="tab-pane" id="tab-points">
	<div class="table-responsive" data-v-product-points>
		<table id="points" class="table table-hover table-bordered">
			<thead>
			<tr>
				<th class="text-start">User Group</th>
				<th class="text-end">Points</th>
				<th class="text-end">
					<button type="button" class="btn btn-sm btn-outline-primary btn-icon" id="add-points-btn" onclick='addTemplate("#points-template", "product_points", "#points")'>
						<svg class="svg-icon" aria-hidden="true"><use href="/admin/default/img/icons.svg#plus"></use></svg>
					</button>
				</th>
			</tr>
			</thead>
			<tbody>
				<tr data-v-points>
				  <td class="text-start">
					  <select name="product_points[#product_points#][user_group_id]" class="form-select" data-v-user_group_id>
						<option value="1" data-v-option>Default group</option>
					  </select>
				  </td>
				  <td class="text-end">
					<input name="product_points[#product_points#][points]" value="5" placeholder="Quantity" class="form-control" type="text" data-v-points-points>
				  </td>
				  <td class="text-end">
					<button type="button" onclick="removeRow(this)" class="btn btn-sm btn-outline-danger btn-icon">
					  <svg class="svg-icon" aria-hidden="true"><use href="/admin/default/img/icons.svg#circle-minus"></use></svg>
					</button>
				  </td>
				</tr>	
				<tr class="d-none" id="points-template">
				  <td class="text-start">
					  <select name="product_points[#product_points#][user_group_id]" class="form-select" data-v-points-user_group_id>
						<option value="1" data-v-option>Default group</option>
					  </select>
				  </td>
				  <td class="text-end">
					<input name="product_points[#product_points#][points]" value="5" placeholder="Quantity" class="form-control" type="text" data-v-points-points>
				  </td>
				  <td class="text-end">
					<button type="button" onclick="removeRow(this)" class="btn btn-sm btn-outline-danger btn-icon">
					  <svg class="svg-icon" aria-hidden="true"><use href="/admin/default/img/icons.svg#circle-minus"></use></svg>
					</button>
				  </td>
				</tr>
			</tbody>
		</table>
	</div>
</div>
