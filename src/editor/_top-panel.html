<div id="top-panel">


	<div class="btn-group ms-2" role="group">

		<button class="btn btn-light px-1" title="Toggle file manager" id="toggle-file-manager-btn"
			data-vvveb-action="toggleFileManager" data-bs-toggle="button" aria-pressed="false">
			<img src="/js/vvvebjs/icons/file-manager-layout.svg" width="12" height="12">
		</button>

		<button class="btn btn-light px-1" title="Toggle left column" id="toggle-left-column-btn"
			data-vvveb-action="toggleLeftColumn" data-bs-toggle="button" aria-pressed="false">
			<img src="/js/vvvebjs/icons/left-column-layout.svg" width="12" height="12">
		</button>

		<button class="btn btn-light px-1" title="Toggle right column" id="toggle-right-column-btn"
			data-vvveb-action="toggleRightColumn" data-bs-toggle="button" aria-pressed="false">
			<img src="/js/vvvebjs/icons/right-column-layout.svg" width="12" height="12">
		</button>

	</div>


	<div>
		<div class="btn-group me-3" role="group">
			<button class="btn btn-light" title="Undo (Ctrl/Cmd + Z)" id="undo-btn" data-vvveb-action="undo"
				data-vvveb-shortcut="ctrl+z">
				<svg class="svg-icon" aria-hidden="true"><use href="/admin/default/img/icons.svg#arrow-back-up"></use></svg>
			</button>

			<button class="btn btn-light" title="Redo (Ctrl/Cmd + Shift + Y)" id="redo-btn" data-vvveb-action="redo"
				data-vvveb-shortcut="ctrl+shift+z">
				<svg class="svg-icon" style="transform: scaleX(-1);" aria-hidden="true"><use href="/admin/default/img/icons.svg#arrow-back-up"></use></svg>
			</button>
		</div>


		<div class="btn-group me-3" role="group">
			<!--
		  <button class="btn btn-light" title="Designer Mode (Free dragging)" id="designer-mode-btn" data-bs-toggle="button" aria-pressed="false" data-vvveb-action="setDesignerMode">
			  <svg class="svg-icon" aria-hidden="true"><use href="/admin/default/img/icons.svg#hand-stop"></use></svg>
		  </button>
		  -->

			<button class="btn btn-light" title="Preview" id="preview-btn" type="button" data-bs-toggle="button"
				aria-pressed="false" data-vvveb-action="preview">
				<svg class="svg-icon" aria-hidden="true"><use href="/admin/default/img/icons.svg#eye"></use></svg>
			</button>

			<button class="btn btn-light" title="Fullscreen (F11)" id="fullscreen-btn" data-bs-toggle="button"
				aria-pressed="false" data-vvveb-action="fullscreen">
				<svg class="svg-icon" aria-hidden="true"><use href="/admin/default/img/icons.svg#maximize"></use></svg>
			</button>

			<button class="btn btn-light" title="Show hidden elements" id="toggle-hidden" data-bs-toggle="button"
				data-vvveb-action="toggleHidden" aria-pressed="false">
				<svg class="svg-icon" aria-hidden="true"><use href="/admin/default/img/icons.svg#scan"></use></svg>
			</button>

			<button class="btn btn-light active" title="Toggle navigator (Ctrl + Shift + L)" id="toggle-tree-list"
				data-bs-toggle="button" data-vvveb-action="toggleTreeList" aria-pressed="true">
				<svg class="svg-icon" aria-hidden="true"><use href="/admin/default/img/icons.svg#stack"></use></svg>
			</button>


			<!-- button class="btn btn-light" title="Download" id="download-btn" data-vvveb-action="download" data-v-download="index.html">
			  <svg class="svg-icon" aria-hidden="true"><use href="/admin/default/img/icons.svg#download"></use></svg>
		  </button -->
		</div>
	</div>


	<div class="btn-group">

		<div class="">

			<button id="color-theme-switch" title="Switch sidebar color theme" class="btn btn-light px-1">
				<svg class="svg-icon" aria-hidden="true"><use href="/admin/default/img/icons.svg#sun"></use></svg>
			</button>

			<a href="#" class="btn btn-light px-1 btn-preview-url" target="_blank" title="View page"><svg
					class="svg-icon" aria-hidden="true"><use href="/admin/default/img/icons.svg#external-link"></use></svg></a>

			<div class="btn-group responsive-btns" role="group">

				<button type="button" class="btn btn-light btn-sm px-1 me-1" data-bs-toggle="dropdown"
					aria-expanded="false" title="Breakpoints">
					<svg class="svg-icon" aria-hidden="true"><use href="/admin/default/img/icons.svg#device-mobile"></use></svg>
				</button>

				<div class="dropdown-menu">

					<button id="mobile-view" data-view="sm" class="btn btn-light w-100" title="Mobile"
						data-vvveb-action="viewport">
						<svg class="svg-icon" aria-hidden="true"><use href="/admin/default/img/icons.svg#device-mobile"></use></svg>
						<span>Mobile view</span>
					</button>

					<button id="tablet-view" data-view="md" class="btn btn-light w-100" title="Tablet"
						data-vvveb-action="viewport">
						<svg class="svg-icon" style="transform: rotate(90deg);" aria-hidden="true"><use href="/admin/default/img/icons.svg#device-tablet"></use></svg>
						<span>Tablet view</span>
					</button>

					<button id="tablet-landscape-view" data-view="lg" class="btn btn-light w-100"
						title="Tablet landscape" data-vvveb-action="viewport">
						<svg class="svg-icon" aria-hidden="true"><use href="/admin/default/img/icons.svg#device-tablet"></use></svg>
						<span>Tablet landscape view</span>
					</button>

					<button id="laptop-view" data-view="xl" class="btn btn-light w-100" title="Laptop"
						data-vvveb-action="viewport">
						<svg class="svg-icon" aria-hidden="true"><use href="/admin/default/img/icons.svg#device-laptop"></use></svg>
						<span>Laptop view</span>
					</button>

					<button id="desktop-view" data-view="xxl" class="btn btn-light w-100" title="Desktop"
						data-vvveb-action="viewport">
						<svg class="svg-icon" aria-hidden="true"><use href="/admin/default/img/icons.svg#device-desktop"></use></svg>
						<span>Desktop view</span>
					</button>

				</div>

				<div class="percent">
					<input type="number" id="zoom" value="100" step="10" min="10" max="100" class="form-control"
						data-vvveb-action="zoomChange" data-vvveb-on="change">
				</div>
			</div>

		</div>

		<div class="align-self-center">
			<button type="button" class="btn btn-light btn-sm me-2" data-bs-toggle="dropdown" aria-expanded="false"
				title="Revisions">
				<strong class="small revisions-count">0</strong>
				<svg class="svg-icon" aria-hidden="true"><use href="/admin/default/img/icons.svg#history"></use></svg>
				<!-- <span>revisions</span> -->
			</button>

			<div class="dropdown-menu">
				<div style="max-height:300px;overflow:auto;" class="revisions-dropdown">
					<div class="dropdown-item d-flex align-items-center">
						<div class="flex-grow-1 me-2">
							<div class="flex-grow-1">
								Today
							</div>
							<span class="small text-muted">
								(2023-06-04 10:30:31)
							</span>

							<!-- <a href="#" target="_blank" class="small text-muted">Admin</a> -->
						</div>
						<div>
							<button class="btn btn-sm btn-outline-secondary border-0" title="Load">
								<svg class="svg-icon" aria-hidden="true"><use href="/admin/default/img/icons.svg#arrow-up"></use></svg>
							</button>
							<button class="btn btn-sm btn-outline-danger text-secondary border-0" title="Delete">
								<svg class="svg-icon" aria-hidden="true"><use href="/admin/default/img/icons.svg#trash"></use></svg>
							</button>
						</div>
					</div>
					<div class="dropdown-item d-flex align-items-center">
						<div class="flex-grow-1 me-2">
							<div class="flex-grow-1">
								Yesterday
							</div>
							<span class="small text-muted">
								(2023-06-03 10:30:31)
							</span>

							<!-- <a href="#" target="_blank" class="small text-muted">Admin</a> -->
						</div>
						<div>
							<button class="btn btn-sm btn-outline-secondary border-0" title="Load">
								<svg class="svg-icon" aria-hidden="true"><use href="/admin/default/img/icons.svg#arrow-up"></use></svg>
							</button>
							<button class="btn btn-sm btn-outline-danger text-secondary  border-0" title="Delete">
								<svg class="svg-icon" aria-hidden="true"><use href="/admin/default/img/icons.svg#trash"></use></svg>
							</button>
						</div>
					</div>
					<div class="dropdown-item d-flex align-items-center">
						<div class="flex-grow-1 me-2">
							<div class="flex-grow-1">
								3 Days ago
							</div>
							<span class="small text-muted">
								(2023-06-01 10:30:31)
							</span>

							<!-- <a href="#" target="_blank" class="small text-muted">Admin</a> -->
						</div>
						<div>
							<button class="btn btn-sm btn-outline-primary border-0" title="Load">
								<svg class="svg-icon" aria-hidden="true"><use href="/admin/default/img/icons.svg#arrow-up"></use></svg>
							</button>
							<button class="btn btn-sm btn-outline-danger border-0" title="Delete">
								<svg class="svg-icon" aria-hidden="true"><use href="/admin/default/img/icons.svg#trash"></use></svg>
							</button>
						</div>
					</div>
				</div>

			</div>
		</div>

		<div class="btn-group me-2" role="group">

			<div class="btn-group" data-v-check-permission-save>
				<button class="btn btn-primary btn-icon btn-sm save-btn" title="Save changes (Ctrl + S)"
					data-vvveb-action="save"
					data-vvveb-url="{$this.adminPath}index.php?module=editor/page-builder&action=save"
					data-v-vvveb-shortcut="ctrl+s" disabled>
					<span class="loading d-none">
						<!--
					  <svg class="svg-icon" aria-hidden="true"><use href="/admin/default/img/icons.svg#device-floppy"></use></svg> 
					  -->
						<span class="spinner-border spinner-border-sm align-middle" role="status"
							aria-hidden="true"></span>
						<span>Saving </span> ...
					</span>

					<span class="button-text">
						<!--
					  <svg class="svg-icon" aria-hidden="true"><use href="/admin/default/img/icons.svg#device-floppy"></use></svg> 
					  -->
						<span>Save</span>
					</span>
				</button>
				<button type="button"
					class="btn btn-icon btn-primary btn-sm save-btn dropdown-toggle dropdown-toggle-split"
					id="showChangesBtn" data-vvveb-action="showChanges" data-bs-toggle="offcanvas" aria-expanded="false"
					data-bs-target="#save-offcanvas" aria-controls="save-offcanvas" data-bs-reference="parent" disabled>

					<span class="visually-hidden">Toggle primary</span>
				</button>
			</div>


		</div>

	</div>

</div>
